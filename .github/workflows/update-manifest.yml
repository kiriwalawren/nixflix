name: Update Manifest

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fetch upstream manifest
        run: |
          NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          JELLYFIN_VERSION=$(nix eval --raw "github:NixOS/nixpkgs/${NIXPKGS_REV}#jellyfin.version")
          curl -fsSL https://obelo.us/upr -H "User-Agent: jellyfin/${JELLYFIN_VERSION}" -o modules/jellyfin/system/jellyfin-universal-plugin-manifest.json

      - name: Commit, open PR, and enable auto-merge if changed
        run: |
          BRANCH="update-jellyfin-manifest"
          MANIFEST="modules/jellyfin/system/jellyfin-universal-plugin-manifest.json"

          if [[ -z "$(git status --porcelain -- "$MANIFEST")" ]]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$MANIFEST"
          git commit -m "chore: update manifests"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: update manifests" \
            --body "Automated Jellyfin plugin manifest update." \
            --base main \
            --head "$BRANCH")

          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
