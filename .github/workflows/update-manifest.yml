name: Update Manifest

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream manifest
        run: curl -fsSL https://repo.jellyfin.org/files/plugin/manifest.json -o modules/jellyfin/system/jellyfin-stable-plugin-manifest.json

      - name: Commit, open PR, and enable auto-merge if changed
        run: |
          BRANCH="update-jellyfin-manifest"
          git diff --exit-code && echo "No changes." && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add modules/jellyfin/system/jellyfin-stable-plugin-manifest.json
          git commit -m "chore: update manifests"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: update manifests" \
            --body "Automated Jellyfin plugin manifest update." \
            --base main \
            --head "$BRANCH")

          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
